<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大逃殺 - Battle Royale</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
#game { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #e94560; margin-bottom: 10px; font-size: 1.8em; }
.status-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; padding: 10px; background: #16213e; border: 1px solid #0f3460; border-radius: 5px; }
.status-bar div { font-size: 0.9em; }
.hp { color: #4ecca3; } .sp { color: #f9d923; } .atk { color: #e94560; } .def { color: #4a90d9; }
.bar { height: 8px; background: #333; border-radius: 4px; margin-top: 3px; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.bar-hp .bar-fill { background: #4ecca3; } .bar-sp .bar-fill { background: #f9d923; }
#log { background: #0f0f23; border: 1px solid #333; border-radius: 5px; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 15px; font-size: 0.85em; line-height: 1.6; }
#log .msg-system { color: #f9d923; } #log .msg-combat { color: #e94560; } #log .msg-item { color: #4ecca3; } #log .msg-danger { color: #ff6b6b; } #log .msg-info { color: #a0a0a0; }
#actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
#actions button { padding: 12px; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 5px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
#actions button:hover:not(:disabled) { background: #0f3460; border-color: #4ecca3; }
#actions button:disabled { opacity: 0.4; cursor: not-allowed; }
#move-select { width: 100%; padding: 10px; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 5px; margin-bottom: 10px; font-size: 0.9em; }
#survivors { background: #16213e; border: 1px solid #0f3460; border-radius: 5px; padding: 10px; font-size: 0.8em; }
#survivors h3 { color: #4a90d9; margin-bottom: 5px; }
.dead { color: #666; text-decoration: line-through; }
.zone-danger { color: #ff6b6b; } .zone-safe { color: #4ecca3; }
#inventory { background: #16213e; border: 1px solid #0f3460; border-radius: 5px; padding: 10px; margin-bottom: 15px; font-size: 0.85em; }
#inventory h3 { color: #f9d923; margin-bottom: 5px; }
#game-over { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; z-index: 100; }
#game-over h2 { font-size: 3em; margin-bottom: 20px; }
#game-over button { padding: 15px 40px; font-size: 1.2em; background: #e94560; border: none; color: white; border-radius: 5px; cursor: pointer; }
.winner { color: #4ecca3; } .loser { color: #e94560; }
#pickup-panel button { padding: 8px 12px; margin: 4px; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
#pickup-panel button:hover { background: #0f3460; border-color: #4ecca3; }
#pickup-panel h3 { color: #4ecca3; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="game">
<h1>⚔️ 大逃殺 Battle Royale ⚔️</h1>
<div class="status-bar">
<div>📍 位置：<span id="location">-</span></div>
<div>👥 存活：<span id="alive-count">-</span></div>
<div class="hp">❤️ 生命：<span id="hp">-</span> <div class="bar bar-hp"><div class="bar-fill" id="hp-bar"></div></div></div>
<div class="sp">⚡ 體力：<span id="sp">-</span> <div class="bar bar-sp"><div class="bar-fill" id="sp-bar"></div></div></div>
<div class="atk">⚔️ 攻擊：<span id="atk">-</span></div>
<div class="def">🛡️ 防禦：<span id="def">-</span></div>
<div>🗡️ 武器：<span id="weapon">-</span></div>
<div>🛡️ 防具：<span id="armor">-</span></div>
<div>📊 等級：<span id="level">-</span></div>
<div>🎯 熟練：<span id="prof">-</span></div>
</div>
<div id="inventory"><h3>🎒 背包 (<span id="inv-count">0</span>/6)</h3><div id="inv-list">空</div></div>
<div id="pickup-panel" style="display:none;background:#1a3a2e;border:1px solid #4ecca3;border-radius:5px;padding:10px;margin-bottom:15px;"></div>
<div id="log"></div>
<select id="move-select" onchange="onZoneSelect()"></select>
<div id="actions">
<button id="btn-move" onclick="doMove()" style="display:none">🚶 移動</button>
<button id="btn-explore" onclick="doExplore()">🔍 探索</button>
<button id="btn-rest" onclick="doRest()">💤 休息</button>
<button id="btn-use" onclick="doUseItem()">💊 使用道具</button>
</div>
<div id="survivors"><h3>📋 戰況</h3><div id="surv-list"></div></div>
</div>
<div id="game-over"><h2 id="go-text"></h2><button onclick="location.reload()">再來一局</button></div>

<script>
const ZONES = ['廢棄醫院','森林小屋','海岸碼頭','山頂神社','商店街','學校','發電廠','地下隧道','公園廣場','軍事基地'];
const WEAPONS = [
{name:'鐵管',atk:8,cat:'殴'},{name:'球棒',atk:12,cat:'殴'},{name:'拳套',atk:15,cat:'殴'},
{name:'小刀',atk:10,cat:'斬'},{name:'武士刀',atk:22,cat:'斬'},{name:'斧頭',atk:18,cat:'斬'},
{name:'手槍',atk:18,cat:'射'},{name:'步槍',atk:25,cat:'射'},{name:'弓',atk:14,cat:'射'},
{name:'飛刀',atk:12,cat:'投'},{name:'手裏劍',atk:10,cat:'投'},{name:'石頭',atk:6,cat:'投'},
{name:'手榴彈',atk:30,cat:'爆'},{name:'炸藥',atk:35,cat:'爆'},{name:'地雷',atk:28,cat:'爆'}
];
const ITEMS = [
{name:'繃帶',type:'heal',val:20},{name:'急救包',type:'heal',val:50},{name:'能量飲料',type:'sp',val:30},
{name:'便當',type:'sp',val:50},{name:'防彈衣',type:'def',val:10},{name:'頭盔',type:'def',val:5}
];
const NAMES = ['影狼','赤鬼','蒼龍','白虎','玄武','朱雀','銀狐','黑豹','金鷹','雷神','風魔','冰姬','炎帝','月讀','星辰'];

let player, bots, turn, dangerZones, nextDanger, gameOver;

function init() {
  gameOver = false; turn = 0; dangerZones = []; nextDanger = 8;
  player = { name: '你', hp: 100, maxHp: 100, sp: 100, maxSp: 100, atk: 10, def: 5, zone: randZone(), weapon: null, armor: null, prof: {殴:0,斬:0,射:0,投:0,爆:0}, lv: 1, exp: 0, inv: [], alive: true };
  bots = [];
  for (let i = 0; i < 12; i++) {
    bots.push({ name: NAMES[i], hp: 80+rand(40), maxHp: 80+rand(40), sp: 80, maxSp: 80, atk: 8+rand(10), def: 3+rand(8), zone: randZone(), weapon: rand(3)>0?WEAPONS[rand(WEAPONS.length)]:null, prof: {殴:rand(20),斬:rand(20),射:rand(20),投:rand(20),爆:rand(20)}, lv:1+rand(3), exp:0, inv: [], alive: true });
  }
  log('═══ 遊戲開始！大逃殺倒數計時 ═══','system');
  log(`你被投放到【${player.zone}】，共 ${bots.length+1} 人參戰。`, 'system');
  log('存活到最後就是勝利者！','system');
  updateUI();
}

function rand(n) { return Math.floor(Math.random()*n); }
function randZone() { return ZONES[rand(ZONES.length)]; }
function log(msg, cls='info') { const d=document.getElementById('log'); d.innerHTML+=`<div class="msg-${cls}">${msg}</div>`; d.scrollTop=d.scrollHeight; }

function onZoneSelect() {
  const dest = document.getElementById('move-select').value;
  const btn = document.getElementById('btn-move');
  btn.style.display = (dest !== player.zone) ? '' : 'none';
}

function doMove() {
  if(gameOver) return;
  const dest = document.getElementById('move-select').value;
  if(dest===player.zone) return;
  if(player.sp<15){log('體力不足，無法移動！','danger');return;}
  player.sp-=15; player.zone=dest;
  document.getElementById('btn-move').style.display='none';
  log(`你移動到了【${dest}】。`,'info');
  checkEncounter(); turn++; botTurn(); checkDanger(); updateUI();
}

function doExplore() {
  if(gameOver) return;
  if(player.sp<10){log('體力不足，無法探索！','danger');return;}
  player.sp-=10;
  const r=rand(100);
  if(r<55){
    // Generate found items (1~2 items to choose from)
    let found = [];
    const count = rand(2)+1;
    for(let i=0;i<count;i++){
      if(rand(100)<50){
        const item=ITEMS[rand(ITEMS.length)];
        found.push({...item});
      } else {
        const w=WEAPONS[rand(WEAPONS.length)];
        found.push({name:w.name,type:'weapon',atk:w.atk,cat:w.cat});
      }
    }
    if(found.length>0){
      log(`🔍 你發現了：${found.map(i=>i.type==='weapon'?`【${i.name}】[${i.cat}系](攻擊+${i.atk})`:`【${i.name}】`).join('、')}`,'item');
      showPickupUI(found);
      return; // Don't advance turn until player picks
    }
  } else if(r<75){
    checkEncounter(true);
  } else {
    log('🔍 什麼都沒發現...','info');
  }
  turn++; botTurn(); checkDanger(); updateUI();
}

function showPickupUI(found) {
  const el = document.getElementById('pickup-panel');
  let html = '<h3>🎁 選擇要撿起的物品：</h3>';
  found.forEach((item,i)=>{
    const desc = item.type==='weapon'?`${item.name}[${item.cat}系](攻擊+${item.atk})`:
                 item.type==='heal'?`${item.name}(生命+${item.val})`:
                 item.type==='sp'?`${item.name}(體力+${item.val})`:
                 `${item.name}(防禦+${item.val})`;
    html+=`<button onclick="pickItem(${i})">${desc}</button> `;
  });
  html+=`<button onclick="pickItem(-1)">❌ 不撿</button>`;
  el.innerHTML=html;
  el.style.display='block';
  el._found=found;
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=true);
}

function pickItem(idx) {
  const el = document.getElementById('pickup-panel');
  const found = el._found;
  el.style.display='none';
  
  if(idx===-1){
    log('你決定不撿。','info');
  } else {
    const item = found[idx];
    if(player.inv.length>=6){
      // Show swap UI
      showSwapUI(item);
      return;
    }
    player.inv.push(item);
    log(`✅ 撿起了【${item.name}】。`,'item');
  }
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=false);
  turn++; botTurn(); checkDanger(); updateUI();
}

function showSwapUI(newItem) {
  const el = document.getElementById('pickup-panel');
  let html = `<h3>🎒 背包已滿！選擇要丟棄的道具來換取【${newItem.name}】：</h3>`;
  player.inv.forEach((item,i)=>{
    html+=`<button onclick="swapItem(${i})">${item.name}</button> `;
  });
  html+=`<button onclick="cancelSwap()">❌ 放棄撿取</button>`;
  el.innerHTML=html;
  el.style.display='block';
  el._newItem=newItem;
}

function swapItem(idx) {
  const el = document.getElementById('pickup-panel');
  const newItem = el._newItem;
  const old = player.inv[idx];
  player.inv[idx] = newItem;
  log(`🔄 丟棄【${old.name}】，撿起【${newItem.name}】。`,'item');
  el.style.display='none';
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=false);
  turn++; botTurn(); checkDanger(); updateUI();
}

function cancelSwap() {
  const el = document.getElementById('pickup-panel');
  el.style.display='none';
  log('你決定不撿。','info');
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=false);
  turn++; botTurn(); checkDanger(); updateUI();
}

function doRest() {
  if(gameOver) return;
  if(player.resting) {
    // 停止休息
    clearInterval(player.restTimer);
    player.resting = false;
    document.getElementById('btn-rest').textContent = '💤 休息';
    log('你停止了休息。','info');
    return;
  }
  player.resting = true;
  document.getElementById('btn-rest').textContent = '⏹️ 停止休息';
  log('💤 你開始休息...每30秒恢復生命+10、體力+10。','info');
  player.restTimer = setInterval(()=>{
    if(gameOver||!player.alive){clearInterval(player.restTimer);player.resting=false;return;}
    player.hp = Math.min(player.maxHp, player.hp + 10);
    player.sp = Math.min(player.maxSp, player.sp + 10);
    log('💤 休息恢復：生命+10，體力+10。','item');
    updateUI();
  }, 30000);
  turn++; botTurn(); checkDanger(); updateUI();
}

function doUseItem() {
  if(gameOver) return;
  if(player.inv.length===0){log('背包是空的！','info');return;}
  const el = document.getElementById('pickup-panel');
  let html = '<h3>🎒 道具欄：</h3>';
  player.inv.forEach((item,i)=>{
    const desc = item.type==='weapon'?`🗡️${item.name}[${item.cat}系](+${item.atk})`:
                 item.type==='heal'?`💊${item.name}(HP+${item.val})`:
                 item.type==='sp'?`⚡${item.name}(SP+${item.val})`:
                 `🛡️${item.name}(DEF+${item.val})`;
    html+=`<div style="margin:4px 0;">${desc} <button onclick="useItemAt(${i})">✅ 使用</button> <button onclick="discardItem(${i})" style="background:#4a1a1a;border-color:#e94560;">🗑️ 丟棄</button></div>`;
  });
  html+=`<br><button onclick="closePanel()">↩️ 關閉</button>`;
  el.innerHTML=html;
  el.style.display='block';
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=true);
}

function useItemAt(idx) {
  const item=player.inv[idx];
  if(item.type==='heal'){player.hp=Math.min(player.maxHp,player.hp+item.val);log(`💊 使用【${item.name}】，生命+${item.val}。`,'item');player.inv.splice(idx,1);}
  else if(item.type==='sp'){player.sp=Math.min(player.maxSp,player.sp+item.val);log(`⚡ 使用【${item.name}】，體力+${item.val}。`,'item');player.inv.splice(idx,1);}
  else if(item.type==='def'){
    // 如果已有同類型防具，放回背包
    if(player.armor){player.inv.splice(idx,1,player.armor);}else{player.inv.splice(idx,1);}
    player.armor=item;player.def=5+item.val;
    log(`🛡️ 裝備【${item.name}】，防禦=${player.def}。`,'item');
  }
  else if(item.type==='weapon'){
    // 如果已有武器，放回背包
    if(player.weapon){player.inv.splice(idx,1,player.weapon);}else{player.inv.splice(idx,1);}
    player.weapon=item;player.atk=10+item.atk;
    log(`🗡️ 裝備【${item.name}】，攻擊力=${player.atk}。`,'item');
  }
  closePanel(); updateUI();
}

function discardItem(idx) {
  const item=player.inv[idx];
  player.inv.splice(idx,1);
  log(`🗑️ 丟棄了【${item.name}】。`,'info');
  closePanel(); updateUI();
}

function closePanel() {
  document.getElementById('pickup-panel').style.display='none';
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=gameOver);
}

function checkEncounter(forced) {
  const enemies=bots.filter(b=>b.alive&&b.zone===player.zone);
  if(enemies.length===0) return;
  if(!forced&&rand(100)>40) return;
  const enemy=enemies[rand(enemies.length)];
  log(`⚠️ 你遭遇了【${enemy.name}】！`,'combat');
  combat(player, enemy);
}

function getProf(entity) {
  if(!entity.weapon) return 0;
  const cat = entity.weapon.cat || '殴';
  return (typeof entity.prof === 'object') ? (entity.prof[cat]||0) : entity.prof;
}

function getTotalAtk(entity) {
  return entity.atk + (entity.weapon?entity.weapon.atk:0) + Math.floor(getProf(entity)/3);
}

function gainExp(entity, amount) {
  if(entity !== player) return;
  entity.exp += amount;
  const needed = entity.lv * 15;
  while(entity.exp >= needed) {
    entity.exp -= needed;
    entity.lv++;
    entity.maxHp += 15;
    entity.hp = Math.min(entity.maxHp, entity.hp + 15);
    entity.maxSp += 10;
    entity.sp = Math.min(entity.maxSp, entity.sp + 10);
    entity.atk += 2;
    entity.def += 1;
    log(`⬆️ 升級！等級 ${entity.lv}！HP上限+15、SP上限+10、攻擊+2、防禦+1`,'system');
  }
}

function combat(a, b) {
  const aDmg=Math.max(1, getTotalAtk(a) - b.def/2 + rand(8));
  const bDmg=Math.max(1, getTotalAtk(b) - a.def/2 + rand(6));
  const aFirst=rand(100)<55;
  if(aFirst){
    b.hp-=aDmg; log(`  你攻擊【${b.name}】造成 ${aDmg} 傷害！`,'combat');
    if(a.weapon&&a===player){const cat=a.weapon.cat;a.prof[cat]=(a.prof[cat]||0)+1+rand(2);}
    if(b.hp<=0){b.alive=false;log(`  💀【${b.name}】被你擊殺！`,'combat');gainExp(a,10+b.lv*3);return;}
    a.hp-=bDmg; log(`  【${b.name}】反擊造成 ${bDmg} 傷害！`,'combat');
  } else {
    a.hp-=bDmg; log(`  【${b.name}】先制攻擊！造成 ${bDmg} 傷害！`,'combat');
    if(a.hp<=0){a.alive=false;endGame(false);return;}
    b.hp-=aDmg; log(`  你反擊造成 ${aDmg} 傷害！`,'combat');
    if(a.weapon&&a===player){const cat=a.weapon.cat;a.prof[cat]=(a.prof[cat]||0)+1+rand(2);}
    if(b.hp<=0){b.alive=false;log(`  💀【${b.name}】被你擊殺！`,'combat');gainExp(a,10+b.lv*3);}
  }
  if(a.hp<=0){a.alive=false;endGame(false);}
}

function botTurn() {
  const alive=bots.filter(b=>b.alive);
  alive.forEach(bot=>{
    const action=rand(100);
    if(action<30) bot.zone=randZone();
    else if(action<50) bot.hp=Math.min(bot.maxHp,bot.hp+10);
    else if(action<60) bot.sp=Math.min(bot.maxSp,bot.sp+15);
    const targets=alive.filter(t=>t!==bot&&t.alive&&t.zone===bot.zone);
    if(targets.length>0&&rand(100)<25){
      const t=targets[rand(targets.length)];
      const dmg=Math.max(1,getTotalAtk(bot)-t.def/2+rand(6));
      t.hp-=dmg;
      if(t.hp<=0){t.alive=false;log(`📢【${bot.name}】擊殺了【${t.name}】！`,'system');bot.lv++;}
    }
  });
  if(dangerZones.length>0){
    alive.forEach(bot=>{if(dangerZones.includes(bot.zone)){bot.zone=ZONES.filter(z=>!dangerZones.includes(z))[rand(ZONES.length-dangerZones.length)]||bot.zone;}});
  }
  checkWin();
}

function checkDanger() {
  if(turn>0&&turn%nextDanger===0&&dangerZones.length<ZONES.length-2){
    const safe=ZONES.filter(z=>!dangerZones.includes(z));
    const newDanger=safe[rand(safe.length)];
    dangerZones.push(newDanger);
    log(`🚨 ═══ 禁區公告：【${newDanger}】已成為禁區！═══`,'danger');
    if(player.zone===newDanger){player.hp-=30;log('⚠️ 你在禁區內！受到 30 傷害！快離開！','danger');}
    bots.filter(b=>b.alive&&b.zone===newDanger).forEach(b=>{b.hp-=30;if(b.hp<=0){b.alive=false;log(`📢【${b.name}】死於禁區！`,'system');}});
    nextDanger=Math.max(4,nextDanger-1);
    checkWin();
  }
  if(dangerZones.includes(player.zone)&&player.alive){player.hp-=10;log('⚠️ 你仍在禁區！持續受到傷害！','danger');}
  if(player.hp<=0&&player.alive){player.alive=false;endGame(false);}
}

function checkWin() {
  const alive=bots.filter(b=>b.alive);
  if(alive.length===0&&player.alive) endGame(true);
}

function endGame(win) {
  gameOver=true;
  const el=document.getElementById('game-over');
  el.style.display='flex';
  document.getElementById('go-text').className=win?'winner':'loser';
  document.getElementById('go-text').textContent=win?'🏆 最後倖存者！你贏了！':'💀 你已死亡...';
}

function updateUI() {
  document.getElementById('location').textContent=player.zone+(dangerZones.includes(player.zone)?' ⚠️禁區':'');
  document.getElementById('alive-count').textContent=`${bots.filter(b=>b.alive).length+1} / ${bots.length+1}`;
  document.getElementById('hp').textContent=`${player.hp}/${player.maxHp}`;
  document.getElementById('sp').textContent=`${player.sp}/${player.maxSp}`;
  document.getElementById('hp-bar').style.width=`${player.hp/player.maxHp*100}%`;
  document.getElementById('sp-bar').style.width=`${player.sp/player.maxSp*100}%`;
  document.getElementById('atk').textContent=player.atk;
  document.getElementById('def').textContent=player.def;
  document.getElementById('weapon').textContent=player.weapon?`${player.weapon.name}[${player.weapon.cat}系]`:'空手';
  document.getElementById('armor').textContent=player.armor?player.armor.name:'無';
  document.getElementById('level').textContent=`Lv.${player.lv} (EXP:${player.exp}/${player.lv*15})`;
  document.getElementById('prof').textContent=`殴:${player.prof.殴} 斬:${player.prof.斬} 射:${player.prof.射} 投:${player.prof.投} 爆:${player.prof.爆}`;
  // inventory
  const invEl=document.getElementById('inv-list');
  document.getElementById('inv-count').textContent=player.inv.length;
  invEl.textContent=player.inv.length?player.inv.map(i=>i.type==='weapon'?`${i.name}[${i.cat}]`:i.name).join('、'):'空';
  // move select
  const sel=document.getElementById('move-select');
  sel.innerHTML=ZONES.filter(z=>!dangerZones.includes(z)).map(z=>`<option value="${z}"${z===player.zone?' selected':''}>${z}${z===player.zone?' (目前)':''}</option>`).join('');
  document.getElementById('btn-move').style.display='none';
  // survivors
  const sl=document.getElementById('surv-list');
  sl.innerHTML=bots.map(b=>`<span class="${b.alive?'':'dead'}">${b.name}${b.alive?'':'💀'}</span>`).join(' | ');
  // disable buttons if dead
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=gameOver);
}

init();
</script>
</body>
</html>
